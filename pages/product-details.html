<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product Details — [COMPANY NAME]</title>
    <meta
      name="description"
      content="Product specifications, key features, applications, packaging formats and certifications from [COMPANY NAME]."
    />
    <meta property="og:title" content="Product Details — [COMPANY NAME]" />
    <meta
      property="og:description"
      content="Specifications, applications and export packaging formats."
    />
    <meta property="og:type" content="product" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="product-details.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <script>
      try {
        var s = localStorage.getItem("site-theme");
        document.documentElement.setAttribute(
          "data-theme",
          s ||
            (matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"),
        );
        var l = localStorage.getItem("site-lang");
        if (l) {
          document.documentElement.lang = l;
          document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
        }
      } catch (e) {}
    </script>
  </head>
  <body data-page="product-details">
    <a class="skip-link" href="#main" data-i18n="nav.skip"
      >Skip to main content</a
    >
    <header class="header" id="site-header"></header>
    <div class="drawer" id="site-drawer" aria-hidden="true"></div>

    <main id="main" data-product-detail>
      <div class="container section"><div class="skeleton"></div></div>
    </main>

    <footer class="footer" id="site-footer"></footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <script type="module" src="../js/main.js"></script>
  </body>
</html>
