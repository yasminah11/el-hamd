<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Products — [COMPANY NAME]</title>
    <meta
      name="description"
      content="Browse the full product catalogue of [COMPANY NAME]. Filter by category or search by product name and code."
    />
    <meta property="og:title" content="Products — [COMPANY NAME]" />
    <meta
      property="og:description"
      content="Full manufacturing catalogue with categories, specifications and export formats."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="products.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <script>
      try {
        var s = localStorage.getItem("site-theme");
        document.documentElement.setAttribute(
          "data-theme",
          s ||
            (matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"),
        );
        var l = localStorage.getItem("site-lang");
        if (l) {
          document.documentElement.lang = l;
          document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
        }
      } catch (e) {}
    </script>
  </head>
  <body data-page="products" data-title-key="products.title">
    <a class="skip-link" href="#main" data-i18n="nav.skip"
      >Skip to main content</a
    >
    <header class="header" id="site-header"></header>
    <div class="drawer" id="site-drawer" aria-hidden="true"></div>

    <main id="main">
      <section class="page-hero">
        <div class="page-hero__media">
          <img
            src="assets/images/product-02.jpg"
            alt=""
            width="1200"
            height="900"
          />
        </div>
        <div class="container page-hero__inner">
          <nav class="breadcrumb" aria-label="Breadcrumb">
            <a href="index.html" data-i18n="breadcrumb.home"></a
            ><span class="sep">›</span><span data-i18n="nav.products"></span>
          </nav>
          <p class="eyebrow" data-i18n="products.eyebrow"></p>
          <h1 data-i18n="products.title"></h1>
          <p data-i18n="products.lead"></p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="toolbar">
            <div class="toolbar__row">
              <div class="search">
                <span class="search__icon" aria-hidden="true">
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                  >
                    <circle cx="11" cy="11" r="7" />
                    <path d="m20 20-3.5-3.5" stroke-linecap="round" />
                  </svg>
                </span>
                <label
                  class="sr-only"
                  for="product-search"
                  data-i18n="products.search"
                ></label>
                <input
                  id="product-search"
                  type="search"
                  data-search
                  data-i18n-attr="placeholder:products.searchPlaceholder"
                />
              </div>
              <label
                class="sr-only"
                for="product-sort"
                data-i18n="products.sort"
              ></label>
              <select id="product-sort" class="select" data-sort>
                <option
                  value="default"
                  data-i18n="products.sortDefault"
                ></option>
                <option value="az" data-i18n="products.sortAZ"></option>
                <option value="za" data-i18n="products.sortZA"></option>
              </select>
            </div>
            <div class="toolbar__row">
              <div
                class="chips"
                data-chips
                role="group"
                aria-label="Filter by category"
              ></div>
              <p
                class="results-count"
                data-count-results
                aria-live="polite"
              ></p>
            </div>
          </div>
          <div class="grid grid--3" data-product-grid></div>
        </div>
      </section>

      <section class="section section--dark">
        <div class="container cta" data-reveal>
          <h2 data-i18n="finalCta.title"></h2>
          <p data-i18n="finalCta.text"></p>
          <div class="cta__actions">
            <a class="btn" href="contact.html" data-i18n="cta.contact"></a>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer" id="site-footer"></footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <script type="module" src="../js/main.js"></script>
  </body>
</html>
