<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Export Catalogue 2026 — Nile Botanica</title>
    <meta
      name="description"
      content="Download the Nile Botanica 2026 export catalogue: medicinal herbs, spices and seasonings, seeds and dehydrated vegetables with codes, specifications and packing formats."
    />
    <meta property="og:title" content="Export Catalogue 2026 — Nile Botanica" />
    <meta
      property="og:description"
      content="Full product index with codes, origins and packing formats for international buyers."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="catalogue.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <script>
      try {
        var s = localStorage.getItem("site-theme");
        document.documentElement.setAttribute(
          "data-theme",
          s ||
            (matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"),
        );
        var l = localStorage.getItem("site-lang");
        if (l) {
          document.documentElement.lang = l;
          document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
        }
      } catch (e) {}
    </script>
  </head>
  <body data-page="catalogue" data-title-key="catalogue.title">
    <a class="skip-link" href="#main" data-i18n="nav.skip"
      >Skip to main content</a
    >
    <header class="header" id="site-header"></header>
    <div class="drawer" id="site-drawer" aria-hidden="true"></div>

    <main id="main">
      <section class="page-head">
        <div class="container">
          <p class="eyebrow" data-i18n="catalogue.eyebrow"></p>
          <h1 data-i18n="catalogue.title"></h1>
          <p class="lead" data-i18n="catalogue.lead"></p>
        </div>
      </section>

      <section class="section section--tight">
        <div class="container">
          <div class="catalogue-card" data-reveal>
            <img
              src="assets/images/cat-spices.jpg"
              alt="Nile Botanica export catalogue cover"
              loading="lazy"
              width="1200"
              height="900"
            />
            <div>
              <h2>Export Catalogue 2026</h2>
              <p data-i18n="catalogue.lead"></p>
              <ul class="editorial__list">
                <li data-i18n="categories.herbs.name"></li>
                <li data-i18n="categories.spices.name"></li>
                <li data-i18n="categories.seeds.name"></li>
                <li data-i18n="categories.dehydrated.name"></li>
              </ul>
              <p class="muted" data-i18n="catalogue.size"></p>
              <div class="hero__actions">
                <a
                  class="btn"
                  href="assets/catalogue/nile-botanica-catalogue-2026.pdf"
                  download
                  data-i18n="catalogue.download"
                ></a>
                <a
                  class="btn btn--ghost"
                  href="contact.html"
                  data-i18n="catalogue.request"
                ></a>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="section section--alt">
        <div class="container">
          <div class="section-head" data-reveal>
            <p class="eyebrow" data-i18n="products.eyebrow"></p>
            <h2 data-i18n="products.title"></h2>
            <p data-i18n="products.lead"></p>
          </div>
          <div class="table-wrap" data-reveal>
            <table class="catalogue-table">
              <thead>
                <tr>
                  <th data-i18n="products.title"></th>
                  <th data-i18n="products.code"></th>
                  <th data-i18n="contact.address"></th>
                  <th data-i18n="product.packaging"></th>
                </tr>
              </thead>
              <tbody data-catalogue-rows></tbody>
            </table>
          </div>
          <p class="mt-lg">
            <a
              class="btn btn--ghost"
              href="products.html"
              data-i18n="cta.viewProducts"
            ></a>
          </p>
        </div>
      </section>
    </main>

    <footer class="footer" id="site-footer"></footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <script type="module" src="../js/main.js"></script>
  </body>
</html>
