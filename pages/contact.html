<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact Our Export Team — [COMPANY NAME]</title>
    <meta
      name="description"
      content="Contact [COMPANY NAME] for product information, specifications, samples, pricing and export inquiries."
    />
    <meta
      property="og:title"
      content="Contact Our Export Team — [COMPANY NAME]"
    />
    <meta
      property="og:description"
      content="Specifications, samples, pricing and export inquiries."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="contact.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <script>
      try {
        var s = localStorage.getItem("site-theme");
        document.documentElement.setAttribute(
          "data-theme",
          s ||
            (matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"),
        );
        var l = localStorage.getItem("site-lang");
        if (l) {
          document.documentElement.lang = l;
          document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
        }
      } catch (e) {}
    </script>
  </head>
  <body data-page="contact" data-title-key="contact.title">
    <a class="skip-link" href="#main" data-i18n="nav.skip"
      >Skip to main content</a
    >
    <header class="header" id="site-header"></header>
    <div class="drawer" id="site-drawer" aria-hidden="true"></div>

    <main id="main">
      <section class="page-hero">
        <div class="page-hero__media">
          <img
            src="assets/images/logistics.jpg"
            alt=""
            width="1600"
            height="1104"
          />
        </div>
        <div class="container page-hero__inner">
          <nav class="breadcrumb" aria-label="Breadcrumb">
            <a href="index.html" data-i18n="breadcrumb.home"></a
            ><span class="sep">›</span><span data-i18n="nav.contact"></span>
          </nav>
          <p class="eyebrow" data-i18n="contact.eyebrow"></p>
          <h1 data-i18n="contact.title"></h1>
          <p data-i18n="contact.lead"></p>
        </div>
      </section>

      <section class="section">
        <div class="container contact-grid">
          <div data-reveal>
            <h2
              style="font-size: var(--fs-h3)"
              data-i18n="contact.infoTitle"
            ></h2>
            <dl class="info-list" style="margin-top: 1.5rem">
              <div>
                <dt data-i18n="contact.phone"></dt>
                <dd>
                  <a
                    data-company-href="tel:phone"
                    data-company="phone"
                    href="#"
                  ></a>
                </dd>
              </div>
              <div>
                <dt data-i18n="contact.whatsapp"></dt>
                <dd>
                  <a
                    data-company-href="wa:whatsapp"
                    data-company="whatsapp"
                    href="#"
                    rel="noopener"
                  ></a>
                </dd>
              </div>
              <div>
                <dt data-i18n="contact.email"></dt>
                <dd>
                  <a
                    data-company-href="mailto:email"
                    data-company="email"
                    href="#"
                  ></a>
                </dd>
              </div>
              <div>
                <dt data-i18n="contact.address"></dt>
                <dd data-company="address"></dd>
              </div>
              <div>
                <dt data-i18n="contact.hours"></dt>
                <dd data-company="hours"></dd>
              </div>
            </dl>
          </div>

          <div data-reveal>
            <h2 style="font-size: var(--fs-h3)" data-i18n="form.title"></h2>
            <form
              class="form"
              style="margin-top: 1.5rem"
              data-contact-form
              novalidate
            >
              <p
                class="form__status"
                data-form-status
                role="status"
                aria-live="polite"
                hidden
              ></p>
              <div class="form__row">
                <div class="field">
                  <label for="f-name"
                    ><span data-i18n="form.name"></span>
                    <span class="req">*</span></label
                  >
                  <input
                    id="f-name"
                    name="name"
                    type="text"
                    autocomplete="name"
                    required
                  />
                  <span class="error" aria-live="polite"></span>
                </div>
                <div class="field">
                  <label for="f-company"
                    ><span data-i18n="form.company"></span>
                    <span class="opt" data-i18n="form.optional"></span
                  ></label>
                  <input
                    id="f-company"
                    name="company"
                    type="text"
                    autocomplete="organization"
                  />
                  <span class="error" aria-live="polite"></span>
                </div>
              </div>
              <div class="form__row">
                <div class="field">
                  <label for="f-email"
                    ><span data-i18n="form.email"></span>
                    <span class="req">*</span></label
                  >
                  <input
                    id="f-email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    required
                  />
                  <span class="error" aria-live="polite"></span>
                </div>
                <div class="field">
                  <label for="f-phone"
                    ><span data-i18n="form.phone"></span>
                    <span class="opt" data-i18n="form.optional"></span
                  ></label>
                  <input
                    id="f-phone"
                    name="phone"
                    type="tel"
                    autocomplete="tel"
                  />
                  <span class="error" aria-live="polite"></span>
                </div>
              </div>
              <div class="form__row">
                <div class="field">
                  <label for="f-country"
                    ><span data-i18n="form.country"></span>
                    <span class="opt" data-i18n="form.optional"></span
                  ></label>
                  <input
                    id="f-country"
                    name="country"
                    type="text"
                    autocomplete="country-name"
                  />
                  <span class="error" aria-live="polite"></span>
                </div>
                <div class="field">
                  <label for="f-subject"
                    ><span data-i18n="form.subject"></span>
                    <span class="opt" data-i18n="form.optional"></span
                  ></label>
                  <input id="f-subject" name="subject" type="text" />
                  <span class="error" aria-live="polite"></span>
                </div>
              </div>
              <div class="field">
                <label for="f-message"
                  ><span data-i18n="form.message"></span>
                  <span class="req">*</span></label
                >
                <textarea id="f-message" name="message" required></textarea>
                <span class="error" aria-live="polite"></span>
              </div>
              <div>
                <button class="btn" type="submit" data-submit>
                  <span data-i18n="form.submit"></span>
                </button>
              </div>
            </form>
          </div>
        </div>
      </section>

      <section class="section section--alt">
        <div class="container">
          <div class="section-head" data-reveal>
            <h2 data-i18n="contact.mapTitle"></h2>
            <p data-i18n="contact.mapNote"></p>
          </div>
          <div class="map-frame" data-reveal>
            <iframe
              title="Factory location map"
              src="https://www.google.com/maps?q=0,0&amp;hl=en&amp;z=3&amp;output=embed"
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
            ></iframe>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer" id="site-footer"></footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <script type="module" src="../js/main.js"></script>
  </body>
</html>
