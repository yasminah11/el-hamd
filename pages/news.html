<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>News & Updates — [COMPANY NAME]</title>
    <meta
      name="description"
      content="Company announcements, production updates and export news from [COMPANY NAME]."
    />
    <meta property="og:title" content="News & Updates — [COMPANY NAME]" />
    <meta
      property="og:description"
      content="Announcements, production updates and export news."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="news.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <script>
      try {
        var s = localStorage.getItem("site-theme");
        document.documentElement.setAttribute(
          "data-theme",
          s ||
            (matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"),
        );
        var l = localStorage.getItem("site-lang");
        if (l) {
          document.documentElement.lang = l;
          document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
        }
      } catch (e) {}
    </script>
  </head>
  <body data-page="news" data-title-key="news.title">
    <a class="skip-link" href="#main" data-i18n="nav.skip"
      >Skip to main content</a
    >
    <header class="header" id="site-header"></header>
    <div class="drawer" id="site-drawer" aria-hidden="true"></div>

    <main id="main">
      <section class="page-hero">
        <div class="page-hero__media">
          <img
            src="assets/images/news-01.jpg"
            alt=""
            width="1200"
            height="800"
          />
        </div>
        <div class="container page-hero__inner">
          <nav class="breadcrumb" aria-label="Breadcrumb">
            <a href="index.html" data-i18n="breadcrumb.home"></a
            ><span class="sep">›</span><span data-i18n="nav.news"></span>
          </nav>
          <p class="eyebrow" data-i18n="news.eyebrow"></p>
          <h1 data-i18n="news.title"></h1>
          <p data-i18n="news.lead"></p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="grid grid--3" data-news-grid></div>
        </div>
      </section>

      <section class="section section--dark">
        <div class="container cta" data-reveal>
          <h2 data-i18n="finalCta.title"></h2>
          <p data-i18n="finalCta.text"></p>
          <div class="cta__actions">
            <a class="btn" href="contact.html" data-i18n="cta.contact"></a>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer" id="site-footer"></footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <script type="module" src="../js/main.js"></script>
  </body>
</html>
