<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gallery — Nile Botanica</title>
    <meta
      name="description"
      content="Photo gallery of Nile Botanica: medicinal herb fields, drying halls, spice milling, quality laboratory and the export warehouse in Fayoum, Egypt."
    />
    <meta property="og:title" content="Gallery — Nile Botanica" />
    <meta
      property="og:description"
      content="Inside our farms, drying halls, laboratory and export warehouse."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="gallery.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <script>
      try {
        var s = localStorage.getItem("site-theme");
        document.documentElement.setAttribute(
          "data-theme",
          s ||
            (matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"),
        );
        var l = localStorage.getItem("site-lang");
        if (l) {
          document.documentElement.lang = l;
          document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
        }
      } catch (e) {}
    </script>
  </head>
  <body data-page="gallery" data-title-key="gallery.title">
    <a class="skip-link" href="#main" data-i18n="nav.skip"
      >Skip to main content</a
    >
    <header class="header" id="site-header"></header>
    <div class="drawer" id="site-drawer" aria-hidden="true"></div>

    <main id="main">
      <section class="page-head">
        <div class="container">
          <p class="eyebrow" data-i18n="gallery.eyebrow"></p>
          <h1 data-i18n="gallery.title"></h1>
          <p class="lead" data-i18n="gallery.lead"></p>
        </div>
      </section>

      <section class="section section--tight">
        <div class="container">
          <div
            class="gallery-filters"
            data-gallery-filters
            role="group"
            aria-label="Gallery filters"
          ></div>
          <div class="gallery-grid" data-gallery-grid></div>
        </div>
      </section>

      <section class="section section--dark">
        <div class="container text-center">
          <h2 data-i18n="finalCta.title"></h2>
          <p data-i18n="finalCta.text"></p>
          <p class="mt-lg">
            <a
              class="btn btn--onDark"
              href="contact.html"
              data-i18n="cta.contact"
            ></a>
          </p>
        </div>
      </section>
    </main>

    <footer class="footer" id="site-footer"></footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <script type="module" src="../js/main.js"></script>
  </body>
</html>
